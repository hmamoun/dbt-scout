name: 'dbt_scout_integration_tests'
version: '0.1.3'
config-version: 2
profile: 'dbt_scout_integration_tests'

model-paths: ["models"]
test-paths: ["tests"]

# Install packages outside the repo. `local: ../` copies the whole parent folder, so a
# dbt_packages folder inside it would be copied into itself without end.
packages-install-path: "../../.dbt_scout_integration_packages"

clean-targets: ["target"]

on-run-start:
  - "create or replace table {{ target.database }}.{{ target.schema }}.scout_it_leftover as select 1 as id"

on-run-end:
  - "drop table if exists {{ target.database }}.{{ target.schema }}.scout_it_leftover"
